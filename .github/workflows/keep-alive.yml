name: Keep Koyeb Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # toutes les 5 minutes
  workflow_dispatch:        # permet de lancer manuellement si besoin

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Koyeb backend
        run: |
          curl -f https://symbolic-rubia-svdev-70fd28d2.koyeb.app/health \
            --max-time 10 \
            --retry 2 \
            || echo "Le ping a échoué mais ce n'est pas bloquant"
